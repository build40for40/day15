name: Evals

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: build40for40/actions/setup@v1

      - name: Check the model key is visible
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not visible to this repo, so the coach evals did not run." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run the coach evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm --filter api evals
